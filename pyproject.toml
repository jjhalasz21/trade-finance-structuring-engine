[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "rich>=13.0",
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.scripts]
tfse = "tfse.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tfse"]
